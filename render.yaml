services:
  - type: web
    name: dotace-javor
    runtime: docker
    plan: 0.5c-512mb
    region: oregon
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: false
    disk:
      name: dotace-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: ADMIN_EMAIL
        value: admin@javor.example
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: DATA_DIR
        value: /var/data
