name: Application checks
on:
  pull_request:
  push:
    branches: [main, 'codex/**']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: dotace_backend_test
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --include=dev
      - run: npm run check
      - run: npm run test:integration
        env:
          PG_SSL: 'false'
          TEST_DATABASE_URL: postgresql://postgres:synthetic-ci-only@localhost:5432/dotace_backend_test
      - run: npm run test:native
        env:
          PG_SSL: 'false'
          DATABASE_URL: postgresql://postgres:synthetic-ci-only@localhost:5432/postgres
      - run: npm audit --omit=dev --audit-level=high
      - run: docker build -t dotace-ci .
